name: 01-Job-Level-Variables
on:
  workflow_dispatch
jobs:
    dev-job:
       runs-on: ubuntu-latest
       env:
        ENVIRONMENT: "dev"
        APP_NAME: Academy
       steps:
       - name: Print Variables
         run: |
           echo "printing environmnental variables"
           echo "Application Name is : $APP_NAME"
           echo "Environment Name is : $ENVIRONMENT"
    staging-job:
       runs-on: ubuntu-latest
       var:
        ENVIRONMENT: "staging"
        APP_NAME: Academy-Stage
       steps:
       - name: Print Variables
         run: |
           echo "printing environmnental variables"
           echo "Application Name is : $APP_NAME"
           echo "Environment Name is : $ENVIRONMENT"       
name: 06-github-multi-job-example
on:
  workflow_dispatch:
jobs:
    build-env-job:
        runs-on: ubuntu-latest
        steps:
            - name:  Set Env Variables
              run: |
                 echo "BUILD_VERSION=${{ github.run_number }}" >> $GITHUB_ENV
                 echo "RUN_ID=${{ github.run_id }}" >> $GITHUB_ENV
            - name:  Use Build Env Variables
              run: |
                 echo "BUILD_VERSION: $BUILD_VERSION"
                 echo "RUN_ID: $RUN_ID"
    secon-env-job:
        runs-on: ubuntu-latest
        needs: build-env-job
        steps:
            - name:  Print Build Variables in Second Job
              run: |
                 echo "Trying to print the env variable in the second job"
                 echo "BUILD_VERSION: $BUILD_VERSION"
                 echo "RUN_ID: $RUN_ID"     